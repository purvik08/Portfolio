<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Products — Axyntra Robotics</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --navy: #0d2240; --navy-mid: #163560; --cyan: #00c2e0; --orange: #f77f00; --orange-lt: #ffab45;
      --card-bg: #f7fafd; --text-body: #3d5170; --text-dark: #0d1f35;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: white; color: var(--text-dark); }
    a { text-decoration: none; color: inherit; }

    nav {
      position: sticky; top: 0; left: 0; right: 0; z-index: 1000;
      padding: 0 6vw; height: 72px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(13,34,64,0.97); backdrop-filter: blur(20px);
    }
    .nav-brand { display: flex; align-items: center; gap: 10px; }
    .brand-mark { width: 36px; height: 36px; background: linear-gradient(135deg, var(--cyan), #1e4a82); clip-path: polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%); display: flex; align-items: center; justify-content: center; }
    .brand-mark span { font-family:'Syne',sans-serif; font-weight:800; font-size:13px; color:white; }
    .brand-name { font-family:'Syne',sans-serif; font-weight:800; font-size:18px; letter-spacing:1.5px; color:white; }
    .brand-name em { color:var(--cyan); font-style:normal; }
    .nav-links { display:flex; gap:36px; list-style:none; }
    .nav-links a { font-size:13px; font-weight:500; letter-spacing:1px; text-transform:uppercase; color:rgba(255,255,255,0.65); transition:color .2s; }
    .nav-links a:hover { color:var(--cyan); }

    .header-banner {
      background: linear-gradient(135deg, var(--navy), var(--navy-mid));
      padding: 80px 6vw 60px; text-align: center; color: white;
    }
    .header-banner h1 { font-family: 'Syne', sans-serif; font-size: 46px; font-weight: 800; margin-bottom: 12px; }
    .header-banner p { font-size: 16px; color: rgba(255,255,255,0.6); max-width: 600px; margin: 0 auto; line-height: 1.6; }

    .gallery { padding: 80px 6vw; display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 40px; }

    /* Inherited Product Card Styles */
    .pc { border-radius:20px; overflow:hidden; border:1px solid rgba(0,0,0,0.07); background:var(--card-bg); transition:transform .3s,box-shadow .3s; display:flex; flex-direction:column; }
    .pc:hover { transform:translateY(-10px); box-shadow:0 28px 70px rgba(13,34,64,0.12); }
    .pc-top { background:linear-gradient(145deg,var(--navy) 0%,var(--navy-mid) 100%); padding:52px 32px 40px; display:flex; align-items:center; justify-content:center; position:relative; min-height:260px; overflow:hidden; }
    .pc-top-grid { position:absolute; inset:0; background-image:linear-gradient(rgba(0,194,224,0.05) 1px,transparent 1px), linear-gradient(90deg,rgba(0,194,224,0.05) 1px,transparent 1px); background-size:28px 28px; }
    .pc-tag { position:absolute; top:18px; left:18px; font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:5px 12px; border-radius:50px; }
    .tag-f { background:var(--orange); color:white; }
    .tag-n { background:var(--cyan); color:var(--navy); }
    .pc-cglow { position:absolute; bottom:-40px; right:-40px; width:180px; height:180px; border-radius:50%; pointer-events:none; }
    .pcg-o { background:radial-gradient(circle,rgba(247,127,0,0.2),transparent 65%); }
    .pcg-c { background:radial-gradient(circle,rgba(0,194,224,0.2),transparent 65%); }
    .pc-body { padding:32px 28px 28px; flex:1; display:flex; flex-direction:column; }
    .pc-title { font-family:'Syne',sans-serif; font-weight:800; font-size:26px; color:var(--navy); }
    .pc-desc { font-size:14px; color:var(--text-body); line-height:1.7; margin-top:10px; }
    .pc-specs { margin-top:22px; display:grid; grid-template-columns:1fr 1fr; border-radius:10px; overflow:hidden; border:1px solid rgba(0,0,0,0.07); }
    .sp { padding:10px 14px; background:white; border-bottom:1px solid rgba(0,0,0,0.05); }
    .sp:nth-child(odd) { border-right:1px solid rgba(0,0,0,0.05); }
    .sp-k { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:rgba(61,81,112,0.6); margin-bottom:3px; }
    .sp-v { font-size:13px; font-weight:600; color:var(--navy); }
    .pc-footer { display:flex; align-items:center; justify-content:space-between; margin-top:24px; }
    .pc-price { font-family:'Syne',sans-serif; font-size:13px; font-weight:700; color:var(--text-body); }
    .pc-price strong { font-size:22px; color:var(--navy); }
    .btn-pc { display:inline-flex; align-items:center; gap:8px; background:var(--navy); color:white; padding:11px 22px; border-radius:8px; font-family:'Syne',sans-serif; font-weight:700; font-size:13px; letter-spacing:.5px; cursor:pointer; transition:background .2s,box-shadow .2s; }
    .btn-pc:hover { background:var(--cyan); color:var(--navy); box-shadow:0 6px 22px rgba(0,194,224,0.18); }

    footer { background:#070f1c; padding:28px 6vw; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; border-top:1px solid rgba(0,194,224,0.1); color: white; }
    .footer-links { display:flex; gap:28px; }
    .footer-links a { font-size:12px; color:rgba(255,255,255,.35); transition:color .2s; }
    .footer-links a:hover { color:var(--cyan); }
  </style>
</head>
<body>

<nav id="navbar">
  <a href="index.html" class="nav-brand">
    <div class="brand-mark"><span>AX</span></div>
    <div class="brand-name">AXYNTRA <em>ROBOTICS</em></div>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="index.html#why">Why Us</a></li>
    <li><a href="index.html#learn">Learn</a></li>
    <li><a href="admin.html">Admin</a></li>
  </ul>
</nav>

<div class="header-banner">
  <h1>All Products</h1>
  <p>Explore our complete lineup of professional-grade robotics kits, hardware modules, and accessories for students and makers.</p>
</div>

<div class="gallery" id="productsGallery">
  <!-- Filled dynamically via JS -->
</div>

<footer>
  <div style="font-family:'Syne',sans-serif; font-weight:800; font-size:17px; letter-spacing:1px;">AXYNTRA <em style="color:var(--cyan); font-style:normal;">ROBOTICS</em></div>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="projects.html">Products</a>
    <a href="admin.html" style="color:var(--cyan);font-weight:600;">Admin Portal</a>
  </div>
</footer>

<script>
  async function renderProducts() {
    try {
      const res = await fetch('/api/projects');
      const projects = await res.json();
      const gallery = document.getElementById('productsGallery');
      
      gallery.innerHTML = projects.map(project => {
        const specsHtml = project.specs.map(spec => `<div class="sp"><div class="sp-k">${spec.key}</div><div class="sp-v">${spec.value}</div></div>`).join('');
        return `
          <div class="pc">
            <div class="pc-top">
              <div class="pc-top-grid"></div>
              <span class="pc-tag ${project.tagClass || 'tag-n'}">${project.tag || 'New'}</span>
              <div class="pc-cglow ${project.tagClass === 'tag-f' ? 'pcg-o' : 'pcg-c'}"></div>
            </div>
            <div class="pc-body">
              <div class="pc-title">${project.name}</div>
              <p class="pc-desc">${project.description}</p>
              <div class="pc-specs">${specsHtml}</div>
              <div class="pc-footer">
                <div class="pc-price">${project.price ? `Starting at<br><strong>${project.price}</strong>` : 'Contact for pricing'}</div>
                <a href="index.html#contact" class="btn-pc">Inquire Now</a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    } catch (e) {
      console.error(e);
      document.getElementById('productsGallery').innerHTML = '<p>Error loading products.</p>';
    }
  }

  renderProducts();
</script>
</body>
</html>
